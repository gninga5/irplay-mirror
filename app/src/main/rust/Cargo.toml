# Componente Rust di iRPlay: libreria statica inclusa in libirplay_native.so (vedi
# app/src/main/cpp/CMakeLists.txt). Si migra qui, un modulo alla volta, il codice che
# legge dati dalla rete: in Rust gli errori di memoria non compilano.
[package]
name = "irplay_core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
# staticlib per Android e per i test sul Mac; rlib per i test Rust (cargo test).
crate-type = ["staticlib", "rlib"]

[dependencies]
# Decoder ALAC scritto interamente in Rust (MPL-2.0): sostituisce FFmpeg.
symphonia-core = { version = "=0.6.1", default-features = false }
symphonia-codec-alac = { version = "=0.6.1", default-features = false }
# Crittografia (fase 5): RustCrypto e dalek, librerie pure Rust al posto di mbedTLS e libsodium.
aes = { version = "=0.9.4", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize", "static_secrets"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
crypto-bigint = { version = "=0.7.10", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
subtle = { version = "=2.6.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }

[profile.release]
# I panic si intercettano al confine con il C++ (guard in lib.rs): un pacchetto malevolo
# fa perdere quel pacchetto, non chiude l'app.
panic = "unwind"
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = "debuginfo"

[profile.dev]
panic = "unwind"
